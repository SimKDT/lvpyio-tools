[project]
name = "lvpyioTools"
description = "A set of tools to handle LabView files and data via the lvpyio library."
requires-python = ">=3.12.3"
version = "2.4.3"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Simon Cadet", email = "simon.cadet@univ-poitiers.fr" },
]
dependencies = [
    "numpy",
    "matplotlib",
    "tqdm",
    "Pillow",
    "lvpyio",
    "pylogs @ git+https://github.com/SimKDT/pylogs.git",
]

[project.scripts]
lvpyioShow = "lvpyioTools.viewer:main"

[[tool.pydoc-markdown.loaders]]
type = "python"
search_path = [ "../src" ]

[tool.pydoc-markdown.renderer]
type = "mkdocs"

[[tool.pydoc-markdown.renderer.pages]]
title = "API Documentation"
name = "index"
contents = [ "school.*" ]
