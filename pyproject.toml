[project]
name = "lvpyioTools"
description = "A set of tools to handle LabView files and data via the lvpyio library."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12.3"
version = "2.8.0"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "SimKDT", email = "simon.cadet79+github@proton.me" },
]
dependencies = [
    "numpy>=2.5.1",
    "matplotlib>=3.11.1",
    "Pillow>=12.3.0",
    "lvpyio>=1.4.0",
    "rich>=15.0.0",
]
classifiers = [
    "Programming Language :: Python :: 3.12",

    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Visualization",

    "Topic :: Multimedia",
    "Topic :: Multimedia :: Graphics :: Presentation",
    "Topic :: Multimedia :: Graphics :: Viewers",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Video :: Display",
]

[project.urls]
Homepage = "https://github.com/SimKDT/lvpyio-tools"
Issues = "https://github.com/SimKDT/lvpyio-tools/issues"
Documentation = "https://simkdt.github.io/lvpyio-tools"

[project.optional-dependencies]
docs = [
    "sphinx>=9.1.0",
    "furo",
    "sphinx-autodoc-typehints>=1.23.0",
]

[project.scripts]
lvpyioShow = "lvpyioTools.scripts.viewer:main"
lvpyioTree = "lvpyioTools.scripts.experiment_parser:main"