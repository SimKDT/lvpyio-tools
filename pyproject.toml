[project]
name = "lvpyioTools"
description = "A set of tools to handle LabView files and data via the lvpyio library."
requires-python = ">=3.12.3"
version = "2.4.3"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Simon Cadet", email = "simon.cadet@univ-poitiers.fr" },
]
dependencies = [
    "numpy",
    "matplotlib",
    "tqdm",
    "Pillow",
    "lvpyio>=1.4.0",
    "pylogs @ git+https://github.com/SimKDT/pylogs.git",
]

[project.urls]
Homepage = "https://github.com/SimKDT/lvpyio-tools"
Issues = "https://github.com/SimKDT/lvpyio-tools/issues"

[project.scripts]
lvpyioShow = "lvpyioTools.viewer:main"
